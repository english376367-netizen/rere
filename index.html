<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocabulary Flashcards & Tests</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:linear-gradient(135deg,#eef4ff,#faf5ff);color:#172033}
.app{max-width:1050px;margin:auto;padding:16px}h1{text-align:center;margin:5px 0;font-size:clamp(28px,5vw,42px)}
.sub{text-align:center;color:#667085;margin:0 0 18px}.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:15px}
.tabs button{border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer;background:#e5e7eb}.tabs button.active{background:#4f46e5;color:white}
.panel{display:none}.panel.active{display:block}.card{background:#fff;border-radius:25px;padding:16px;box-shadow:0 12px 35px #17203318}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:center}.hero img{width:100%;max-height:470px;object-fit:contain;border-radius:18px;background:#f8fafc}
.info h2{font-size:40px;margin:0 0 5px}.ipa{color:#4f46e5;font-size:21px;font-weight:700}.vi{font-size:24px;font-weight:700;margin:15px 0}.example{padding:15px;background:#f5f7fb;border-left:5px solid #4f46e5;border-radius:10px;line-height:1.55;font-size:17px}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}.controls button,.check{border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer}.prev{background:#e5e7eb}.next,.check{background:#4f46e5;color:white}.listen{background:#ede9fe;color:#5b21b6}
.count{text-align:center;font-weight:700}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.thumb{border:2px solid #e5e7eb;background:white;border-radius:12px;padding:4px;cursor:pointer}.thumb.active{border-color:#4f46e5}.thumb img{width:100%;aspect-ratio:1.45;object-fit:cover;border-radius:8px}.thumb span{display:block;font-size:12px;padding:4px}
.test-title{text-align:center}.score{font-weight:800;text-align:center;font-size:20px;margin:10px}.question{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 20px #17203312}.question h3{margin:0 0 10px}.answer{width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:10px;font-size:17px}.options{display:grid;gap:10px}.opt{padding:13px;border:2px solid #e5e7eb;background:#fff;border-radius:12px;text-align:left;cursor:pointer;font-size:16px}.opt.selected{border-color:#4f46e5;background:#eef2ff}.opt.correct{border-color:#16a34a;background:#ecfdf3}.opt.wrong{border-color:#dc2626;background:#fef2f2}.explain{display:none;margin-top:10px;padding:12px;background:#fff7ed;border-left:4px solid #f59e0b;border-radius:8px;line-height:1.5}.result{display:none;padding:15px;border-radius:14px;background:#eef2ff;text-align:center;font-weight:700;margin:15px 0}
@media(max-width:700px){.hero{grid-template-columns:1fr}.info h2{font-size:32px}.thumbs{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app">
<h1>📚 Vocabulary Learning</h1><p class="sub">Flashcards • Writing Test • Meaning Test</p>
<div class="tabs"><button class="active" onclick="tab('flash',this)">📖 Flashcards</button><button onclick="tab('write',this)">✍️ Write the Word</button><button onclick="tab('meaning',this)">🧠 Choose the Meaning</button></div>

<section id="flash" class="panel active"><div class="card"><div class="hero"><img id="fimg"><div class="info"><h2 id="fword"></h2><div class="ipa" id="fipa"></div><div class="vi" id="fvi"></div><div class="example"><b>Example:</b> <span id="fex"></span></div></div></div>
<div class="count" id="fcount"></div><div class="controls"><button class="prev" onclick="prev()">← Previous</button><button class="listen" onclick="listen()">🔊 Listen</button><button class="next" onclick="next()">Next →</button></div></div><div class="thumbs" id="thumbs"></div></section>

<section id="write" class="panel"><div class="card"><h2 class="test-title">✍️ Write the English Word</h2><p class="sub">Look at the Vietnamese meaning and type the English word.</p><div id="writeQs"></div><button class="check" onclick="checkWrite()">Check Answers</button><div class="result" id="writeResult"></div></div></section>

<section id="meaning" class="panel"><div class="card"><h2 class="test-title">🧠 Choose the Vietnamese Meaning</h2><p class="sub">Choose the correct Vietnamese meaning for each English word.</p><div id="meaningQs"></div><button class="check" onclick="checkMeaning()">Check Answers</button><div class="result" id="meaningResult"></div></div></section>
</div>
<script>
const data = [{"w": "Understand", "ipa": "/ˌʌndəˈstænd/", "vi": "hiểu", "ex": "I understand what you mean.", "img": "vocab_flashcard_images/card_01.jpg"}, {"w": "Brain", "ipa": "/breɪn/", "vi": "não, bộ não", "ex": "The brain controls many body functions.", "img": "vocab_flashcard_images/card_02.jpg"}, {"w": "Intelligent", "ipa": "/ɪnˈtelɪdʒənt/", "vi": "thông minh", "ex": "Dolphins are highly intelligent animals.", "img": "vocab_flashcard_images/card_03.jpg"}, {"w": "Intelligence", "ipa": "/ɪnˈtelɪdʒəns/", "vi": "trí thông minh", "ex": "Problem-solving requires intelligence.", "img": "vocab_flashcard_images/card_04.jpg"}, {"w": "Human", "ipa": "/ˈhjuːmən/", "vi": "con người; thuộc về con người", "ex": "Humans use language to communicate.", "img": "vocab_flashcard_images/card_05.jpg"}, {"w": "Alike", "ipa": "/əˈlaɪk/", "vi": "giống nhau, tương tự nhau", "ex": "The two brothers look very much alike.", "img": "vocab_flashcard_images/card_06.jpg"}, {"w": "Whistle", "ipa": "/ˈwɪsəl/", "vi": "huýt sáo; tiếng còi", "ex": "He can whistle very loudly.", "img": "vocab_flashcard_images/card_07.jpg"}, {"w": "Conversation", "ipa": "/ˌkɒnvəˈseɪʃən/", "vi": "cuộc trò chuyện", "ex": "We had a long conversation after dinner.", "img": "vocab_flashcard_images/card_08.jpg"}, {"w": "Pod", "ipa": "/pɒd/", "vi": "nhóm (cá voi/cá heo); quả đậu", "ex": "A pod of dolphins was swimming near the boat.", "img": "vocab_flashcard_images/card_09.jpg"}, {"w": "Strategy", "ipa": "/ˈstrætədʒi/", "vi": "chiến lược", "ex": "We need a clear strategy to solve the problem.", "img": "vocab_flashcard_images/card_10.jpg"}, {"w": "Fisherman", "ipa": "/ˈfɪʃəmən/", "vi": "ngư dân", "ex": "The fisherman went out to sea early.", "img": "vocab_flashcard_images/card_11.jpg"}, {"w": "Net", "ipa": "/net/", "vi": "lưới", "ex": "The fisherman threw his net into the water.", "img": "vocab_flashcard_images/card_12.jpg"}, {"w": "Advantage", "ipa": "/ədˈvɑːntɪdʒ/", "vi": "lợi thế, ưu điểm", "ex": "Speaking English gives you an advantage at work.", "img": "vocab_flashcard_images/card_13.jpg"}, {"w": "Assist", "ipa": "/əˈsɪst/", "vi": "hỗ trợ, giúp đỡ", "ex": "The nurse assisted the doctor.", "img": "vocab_flashcard_images/card_14.jpg"}, {"w": "System", "ipa": "/ˈsɪstəm/", "vi": "hệ thống", "ex": "The school has a new computer system.", "img": "vocab_flashcard_images/card_15.jpg"}, {"w": "Method", "ipa": "/ˈmeθəd/", "vi": "phương pháp, cách thức", "ex": "This method helps students remember new words.", "img": "vocab_flashcard_images/card_16.jpg"}];
let idx=0;
const norm=s=>s.trim().toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ");
function tab(id,btn){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function renderFlash(){let x=data[idx];document.getElementById('fimg').src=x.img;document.getElementById('fword').textContent=x.w;document.getElementById('fipa').textContent=x.ipa;document.getElementById('fvi').textContent=x.vi;document.getElementById('fex').textContent=x.ex;document.getElementById('fcount').textContent=`Card ${idx+1} of ${data.length}`;document.querySelectorAll('.thumb').forEach((b,i)=>b.classList.toggle('active',i===idx))}
function next(){idx=(idx+1)%data.length;renderFlash()}function prev(){idx=(idx+data.length-1)%data.length;renderFlash()}function go(i){idx=i;renderFlash()}
function listen(){let u=new SpeechSynthesisUtterance(data[idx].w);u.lang='en-GB';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
document.getElementById('thumbs').innerHTML=data.map((x,i)=>`<button class="thumb" onclick="go(${i})"><img src="${x.img}"><span>${i+1}. ${x.w}</span></button>`).join('');

document.getElementById('writeQs').innerHTML=data.map((x,i)=>`<div class="question"><h3>${i+1}. ${x.vi}</h3><input class="answer" id="w${i}" placeholder="Type the English word"></div>`).join('');
document.getElementById('meaningQs').innerHTML=data.map((x,i)=>{let opts=[x.vi];while(opts.length<4){let v=data[Math.floor(Math.random()*data.length)].vi;if(!opts.includes(v))opts.push(v)}opts.sort(()=>Math.random()-.5);return `<div class="question"><h3>${i+1}. ${x.w}</h3><div class="options">${opts.map(o=>`<button class="opt" data-q="${i}" data-v="${o.replace(/"/g,'&quot;')}" onclick="selectMeaning(this,${i})">${o}</button>`).join('')}</div><div class="explain" id="mexp${i}"></div></div>`}).join('');

function checkWrite(){let score=0;data.forEach((x,i)=>{let el=document.getElementById('w'+i);let ok=norm(el.value)===norm(x.w);if(ok)score++;el.style.borderColor=ok?'#16a34a':'#dc2626'});let r=document.getElementById('writeResult');r.style.display='block';r.innerHTML=`Score: ${score}/${data.length} (${Math.round(score/data.length*100)}%)`;if(score<data.length)r.innerHTML+=`<br><small>Review the flashcards and try again.</small>`}
let selected={};
function selectMeaning(btn,q){document.querySelectorAll(`.opt[data-q="${q}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');selected[q]=btn.dataset.v}
function checkMeaning(){let score=0;data.forEach((x,i)=>{let opts=document.querySelectorAll(`.opt[data-q="${i}"]`);opts.forEach(b=>{b.classList.remove('correct','wrong');if(b.dataset.v===x.vi)b.classList.add('correct');else if(b.dataset.v===selected[i])b.classList.add('wrong')});let exp=document.getElementById('mexp'+i);exp.style.display='block';if(selected[i]===x.vi){score++;exp.innerHTML=`✅ Correct. <b>${x.w}</b> means <b>${x.vi}</b>. Example: ${x.ex}`}else exp.innerHTML=`❌ Not quite. The correct answer is <b>${x.vi}</b>. <b>${x.w}</b> means “${x.vi}”. Example: ${x.ex}`});let r=document.getElementById('meaningResult');r.style.display='block';r.innerHTML=`Score: ${score}/${data.length} (${Math.round(score/data.length*100)}%)`}
renderFlash();
</script></body></html>
